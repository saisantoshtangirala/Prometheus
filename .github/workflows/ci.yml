name: CI - Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call: {}   # allows deploy-hetzner.yml to reuse this as a gate

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-timeout pyyaml scipy hypothesis

      - name: Run full test suite
        run: python -m pytest tests/ -q --timeout=600

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: ignore
