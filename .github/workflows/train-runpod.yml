name: Train on RunPod GPU

# Runs every trading-day morning (well before NSE - India - market open)
# AND on manual dispatch. Fully automated GPU training via RunPod's REST
# API (docs.runpod.io):
#   1. POST /v1/pods           - create a fresh pod. By default (gpu_type
#                                 input left as "auto") the "Pick GPU" step
#                                 queries RunPod's catalog (api.runpod.io/v2
#                                 /catalog/gpus) for what's actually in
#                                 stock right now and tries candidates
#                                 cheapest-first across both Community and
#                                 Secure Cloud, so a single GPU type/cloud
#                                 having no capacity (routine - Community is
#                                 peer-hosted and fluctuates) doesn't fail
#                                 an unattended nightly run that has no one
#                                 around to retry by hand. Passing an
#                                 explicit gpu_type still forces that one
#                                 type (tried on its requested cloud, then
#                                 Secure as a fallback).
#   2. GET  /v1/pods/{id}      - poll until running, read its real IP:port
#   3. ssh/scp                 - push this checkout, train, pull the
#                                 checkpoint back
#   4. DELETE /v1/pods/{id}    - ALWAYS terminate (even on failure) - a
#                                 fresh pod every run means zero idle
#                                 billing between runs, no persistent
#                                 infrastructure to maintain or forget about
#   5. scp                     - deliver the checkpoint to the Hetzner box
#                                 so Kronos (kronos/orchestrator.py:
#                                 maybe_adopt_runpod_checkpoint) picks it up
#
# All pod orchestration lives here now, not on Hetzner - scheduling and
# infra lifecycle belong in CI/CD, not embedded in the process that's
# also responsible for trading every day. Kronos itself holds no RunPod
# credentials at all; it only watches checkpoints/runpod/ for a file this
# workflow delivered.
#
# Repo secrets needed:
#   RUNPOD_API_KEY, RUNPOD_SSH_PRIVATE_KEY  - reach RunPod (private half of
#     a keypair registered under RunPod Settings -> SSH Public Keys -
#     RunPod bakes account-level keys into every new pod's authorized_keys
#     at boot automatically)
#   HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY - already exist for
#     deploy-hetzner.yml; reused here to deliver the checkpoint
#
# The scheduled trigger fires at 22:00 UTC Sun-Thu, which is 03:30 IST
# Mon-Fri the following calendar day - comfortably (~5h45m) before NSE's
# 09:15 IST open. The "Skip on non-trading days" step below additionally
# checks the real NSE holiday calendar (kronos/calendar_utils.py - the
# same code Kronos's own phase gating uses, so this can never drift out
# of sync with it) and skips the rest of the job - no pod is ever created
# on a day Kronos wouldn't trade on anyway. Manual (workflow_dispatch)
# runs always run, even on a non-trading day, since a human explicitly
# asked for one.
#
# The Train step below passes --tickers explicitly, read from
# kronos/config.yaml, rather than relying on scripts/train.py's own
# default (broader, US+India combined) universe - the produced
# checkpoint's per-position semantics must exactly match Kronos's live
# ticker order for load_runpod_checkpoint() to load it correctly into
# ReflexArc.snn (kronos/orchestrator.py). The broader default universe
# (prometheus/data/market_fetcher.py) is still there for anyone running
# train.py by hand without --tickers.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 22 * * 0-4"   # 22:00 UTC Sun-Thu = 03:30 IST Mon-Fri, well before NSE 09:15 open
  workflow_dispatch:
    inputs:
      mode:
        description: "training mode - 'nightevolver-*' run the GA/RL trainer, the rest run scripts/train.py's SNN pipeline"
        required: false
        default: "full"
        type: choice
        options: [pretrain, finetune, meta, evolve, full, nightevolver-ga, nightevolver-rl]
      generations:
        description: "nightevolver-ga only: GA generations (population is 50)"
        required: false
        default: "20"
        type: string
      history_start:
        description: "nightevolver only: history start date (YYYY-MM-DD)"
        required: false
        default: "2022-01-01"
        type: string
      gpu_type:
        description: "\"auto\" = pick the cheapest in-stock GPU that fits (recommended), or an exact RunPod GPU type ID to force one"
        required: false
        default: "auto"
        type: string
      cloud_type:
        description: "COMMUNITY (cheaper) or SECURE - ignored when gpu_type is \"auto\" (both are considered)"
        required: false
        default: "COMMUNITY"
        type: choice
        options: [COMMUNITY, SECURE]

env:
  RUNPOD_API: https://rest.runpod.io/v1

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve run parameters
        id: params
        run: |
          set -euo pipefail
          pip install -q pyyaml
          echo "mode=${{ github.event.inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"
          echo "generations=${{ github.event.inputs.generations || '20' }}" >> "$GITHUB_OUTPUT"
          echo "history_start=${{ github.event.inputs.history_start || '2022-01-01' }}" >> "$GITHUB_OUTPUT"
          echo "gpu_type=${{ github.event.inputs.gpu_type || 'auto' }}" >> "$GITHUB_OUTPUT"
          echo "cloud_type=${{ github.event.inputs.cloud_type || 'COMMUNITY' }}" >> "$GITHUB_OUTPUT"
          N_ASSETS=$(python3 -c "
          import yaml
          cfg = yaml.safe_load(open('kronos/config.yaml'))
          print(len(cfg['data']['tickers']))
          ")
          echo "n_assets=$N_ASSETS" >> "$GITHUB_OUTPUT"
          TICKERS=$(python3 -c "
          import yaml
          cfg = yaml.safe_load(open('kronos/config.yaml'))
          print(','.join(cfg['data']['tickers']))
          ")
          echo "tickers=$TICKERS" >> "$GITHUB_OUTPUT"

      - name: Skip on non-trading days (scheduled runs only)
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Loaded as a standalone file, not `import kronos` - calendar_utils.py
          # is the one module in this package with zero third-party
          # dependencies, and it should stay that way: importing the `kronos`
          # package normally would run kronos/__init__.py first, which pulls
          # in torch/numpy/pandas/etc. just to check a weekday.
          SHOULD_RUN=$(python3 -c "
          import importlib.util
          from datetime import datetime
          from zoneinfo import ZoneInfo
          spec = importlib.util.spec_from_file_location('calendar_utils', 'kronos/calendar_utils.py')
          calendar_utils = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(calendar_utils)
          today = datetime.now(ZoneInfo('Asia/Kolkata')).date()
          print('true' if calendar_utils.is_nse_trading_day(today) else 'false')
          ")
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Not a trading day (weekend or NSE holiday) - skipping, no pod will be created."
          fi

      - name: Load RunPod SSH key
        if: steps.gate.outputs.should_run == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RUNPOD_SSH_PRIVATE_KEY }}

      - name: Pick GPU (cheapest in-stock option that fits, unless forced)
        id: pick
        if: steps.gate.outputs.should_run == 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          python3 -c "
          import json
          import os
          import sys
          import urllib.request

          # Kronos's SNN/evolution training is small - 16GB is comfortable
          # headroom, not a measured floor. \$1/hr is a sanity cap so a
          # catalog quirk never books something like an H100 by accident.
          MIN_MEMORY_GB = 16
          MAX_PRICE_PER_HR = 1.00
          # known-good, generally well-stocked types - used only if the
          # catalog lookup itself fails or returns nothing usable
          FALLBACK_GPU_IDS = ['NVIDIA GeForce RTX 4090', 'NVIDIA RTX A4000', 'NVIDIA RTX A5000']

          requested_gpu = '${{ steps.params.outputs.gpu_type }}'
          requested_cloud = '${{ steps.params.outputs.cloud_type }}'

          candidates = []
          if requested_gpu != 'auto':
              clouds = [requested_cloud] if requested_cloud == 'SECURE' else [requested_cloud, 'SECURE']
              for cloud in dict.fromkeys(clouds):
                  candidates.append((0.0, cloud, requested_gpu))
          else:
              try:
                  req = urllib.request.Request(
                      'https://api.runpod.io/v2/catalog/gpus?include=AVAILABILITY&product=POD',
                      headers={'Authorization': 'Bearer ' + os.environ['RUNPOD_API_KEY']},
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      catalog = json.load(resp)
                  for gpu in catalog.get('gpus', []):
                      if (gpu.get('memory') or 0) < MIN_MEMORY_GB:
                          continue
                      if gpu.get('availability') == 'NONE':
                          continue
                      price = gpu.get('price') or {}
                      for cloud_key, cloud_name in (('community', 'COMMUNITY'), ('secure', 'SECURE')):
                          # gpu[cloud_key] (bool) is whether that cloud
                          # actually offers this GPU at all - price[cloud_key]
                          # can be a nonzero number even when the bool is
                          # False (seen live: MI300X has community=False but
                          # still lists a community price), so check both.
                          if not gpu.get(cloud_key):
                              continue
                          p = price.get(cloud_key)
                          if p is None or p <= 0 or p > MAX_PRICE_PER_HR:
                              continue
                          candidates.append((p, cloud_name, gpu['id']))
                  candidates.sort(key=lambda c: c[0])
              except Exception as exc:
                  print(f'::warning::GPU catalog lookup failed ({exc}) - using the fixed fallback list.', file=sys.stderr)
              if not candidates:
                  for gpu_id in FALLBACK_GPU_IDS:
                      for cloud_name in ('COMMUNITY', 'SECURE'):
                          candidates.append((0.0, cloud_name, gpu_id))

          if not candidates:
              print('::error::No GPU candidates to try.', file=sys.stderr)
              sys.exit(1)

          candidates = candidates[:8]  # cap pod-creation attempts per run
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('candidates=' + json.dumps(candidates) + chr(10))
          print('GPU candidates to try in order (price/hr, cloud, gpu_id):')
          for c in candidates:
              print(' ', c)
          "

      - name: Create pod
        id: create
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          create_pod() {
            local gpu_id="$1"
            local cloud_type="$2"
            curl -sS -X POST "$RUNPOD_API/pods" \
              -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "kronos-ci-${{ github.run_id }}",
                "imageName": "runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04",
                "gpuTypeIds": ["'"$gpu_id"'"],
                "gpuCount": 1,
                "cloudType": "'"$cloud_type"'",
                "containerDiskInGb": 20,
                "ports": ["22/tcp"]
              }'
          }

          POD_ID=""
          CHOSEN_GPU=""
          CHOSEN_CLOUD=""
          while IFS=$'\t' read -r PRICE CLOUD GPU_ID; do
            echo "Trying $GPU_ID on $CLOUD (\$${PRICE}/hr)..."
            RESPONSE=$(create_pod "$GPU_ID" "$CLOUD")
            echo "$RESPONSE"
            ID=$(echo "$RESPONSE" | jq -r '.id // empty')
            if [ -n "$ID" ]; then
              POD_ID="$ID"
              CHOSEN_GPU="$GPU_ID"
              CHOSEN_CLOUD="$CLOUD"
              break
            fi
            echo "::warning::$GPU_ID on $CLOUD had no capacity - trying the next candidate."
          done < <(echo '${{ steps.pick.outputs.candidates }}' | jq -r '.[] | @tsv')

          if [ -z "$POD_ID" ]; then
            echo "::error::Pod creation failed on every GPU/cloud candidate tried."
            exit 1
          fi
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "Created pod: $POD_ID ($CHOSEN_GPU on $CHOSEN_CLOUD)"

      - name: Poll until the pod is running and reachable
        id: connect
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          POD_ID="${{ steps.create.outputs.pod_id }}"
          for i in $(seq 1 60); do
            RESPONSE=$(curl -sS "$RUNPOD_API/pods/$POD_ID" \
              -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}")
            STATUS=$(echo "$RESPONSE" | jq -r '.desiredStatus // empty')
            IP=$(echo "$RESPONSE" | jq -r '.publicIp // empty')
            PORT=$(echo "$RESPONSE" | jq -r '.portMappings["22"] // empty')
            echo "  [$i/60] status=$STATUS ip=${IP:-<pending>} port=${PORT:-<pending>}"
            if [ "$STATUS" = "RUNNING" ] && [ -n "$IP" ] && [ -n "$PORT" ]; then
              echo "host=$IP" >> "$GITHUB_OUTPUT"
              echo "port=$PORT" >> "$GITHUB_OUTPUT"
              echo "Pod reachable at $IP:$PORT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pod never reported RUNNING with a public IP within 10 minutes."
          exit 1

      - name: Wait for sshd inside the container
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 \
                   -p "${{ steps.connect.outputs.port }}" \
                   "root@${{ steps.connect.outputs.host }}" 'echo ready' 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::SSH never came up inside the container."
          exit 1

      - name: Train
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          ssh -p "${{ steps.connect.outputs.port }}" \
              "root@${{ steps.connect.outputs.host }}" '
            set -euo pipefail
            git clone --branch claude/prometheus-causal-market-ol2pau \
              "https://x-access-token:'"${{ secrets.GITHUB_TOKEN }}"'@github.com/saisantoshtangirala/prometheus" \
              /opt/prometheus
            cd /opt/prometheus
            pip install -q -e .
            pip install -q pyyaml yfinance
            MODE="'"${{ steps.params.outputs.mode }}"'"
            case "$MODE" in
              nightevolver-ga)
                # CPU-bound by design (see scripts/train_nightevolver.py) -
                # --device is accepted for CLI parity and ignored.
                python scripts/train_nightevolver.py --mode ga \
                  --tickers "'"${{ steps.params.outputs.tickers }}"'" \
                  --start "'"${{ steps.params.outputs.history_start }}"'" \
                  --generations "'"${{ steps.params.outputs.generations }}"'" \
                  --population 50
                ;;
              nightevolver-rl)
                python scripts/train_nightevolver.py --mode rl \
                  --tickers "'"${{ steps.params.outputs.tickers }}"'" \
                  --start "'"${{ steps.params.outputs.history_start }}"'" \
                  --episodes 1000
                ;;
              *)
                python scripts/train.py --mode "$MODE" --device cuda \
                  --n-assets "'"${{ steps.params.outputs.n_assets }}"'" \
                  --tickers "'"${{ steps.params.outputs.tickers }}"'"
                ;;
            esac
            tar czf /tmp/checkpoints.tar.gz checkpoints
          '
          scp -P "${{ steps.connect.outputs.port }}" \
              "root@${{ steps.connect.outputs.host }}:/tmp/checkpoints.tar.gz" \
              ./checkpoints.tar.gz

      - name: Upload checkpoint artifact
        if: success() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kronos-checkpoints-${{ github.run_id }}
          path: checkpoints.tar.gz
          retention-days: 30

      - name: Deliver checkpoint to Hetzner
        if: success() && steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.HETZNER_SSH_KEY }}"
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts
          scp checkpoints.tar.gz \
              "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/tmp/runpod_checkpoint.tar.gz"
          ssh "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            set -euo pipefail
            mkdir -p /opt/prometheus/checkpoints/runpod
            tar xzf /tmp/runpod_checkpoint.tar.gz -C /opt/prometheus/checkpoints/runpod --strip-components=1
            rm -f /tmp/runpod_checkpoint.tar.gz
            echo "Delivered - Kronos will pick this up within its next 30-60s poll."
          '

      - name: Terminate pod (ALWAYS - zero idle billing by design)
        if: always() && steps.create.outputs.pod_id != ''
        run: |
          curl -sS -X DELETE "$RUNPOD_API/pods/${{ steps.create.outputs.pod_id }}" \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            -o /dev/null -w "Terminate response: %{http_code}\n" || \
            echo "::error::Failed to terminate pod ${{ steps.create.outputs.pod_id }} - check the RunPod console NOW."
