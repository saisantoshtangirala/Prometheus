name: Train on RunPod GPU

# Runs every trading-day morning (UTC, well before US market open) AND
# on manual dispatch. Fully automated GPU training via RunPod's REST API
# (docs.runpod.io):
#   1. POST /v1/pods           - create a fresh pod (Community Cloud by
#                                 default; if it has no capacity, retries
#                                 once on Secure Cloud automatically - see
#                                 the "Create pod" step - an unattended
#                                 nightly run has no one around to notice
#                                 and retry by hand)
#   2. GET  /v1/pods/{id}      - poll until running, read its real IP:port
#   3. ssh/scp                 - push this checkout, train, pull the
#                                 checkpoint back
#   4. DELETE /v1/pods/{id}    - ALWAYS terminate (even on failure) - a
#                                 fresh pod every run means zero idle
#                                 billing between runs, no persistent
#                                 infrastructure to maintain or forget about
#   5. scp                     - deliver the checkpoint to the Hetzner box
#                                 so Kronos (kronos/orchestrator.py:
#                                 maybe_adopt_runpod_checkpoint) picks it up
#
# All pod orchestration lives here now, not on Hetzner - scheduling and
# infra lifecycle belong in CI/CD, not embedded in the process that's
# also responsible for trading every day. Kronos itself holds no RunPod
# credentials at all; it only watches checkpoints/runpod/ for a file this
# workflow delivered.
#
# Repo secrets needed:
#   RUNPOD_API_KEY, RUNPOD_SSH_PRIVATE_KEY  - reach RunPod (private half of
#     a keypair registered under RunPod Settings -> SSH Public Keys -
#     RunPod bakes account-level keys into every new pod's authorized_keys
#     at boot automatically)
#   HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY - already exist for
#     deploy-hetzner.yml; reused here to deliver the checkpoint
#
# The scheduled trigger only fires Mon-Fri (cron day-of-week), and the
# "Skip on non-trading days" step below additionally checks the real NYSE
# holiday calendar (kronos/calendar_utils.py - the same code Kronos's own
# phase gating uses, so this can never drift out of sync with it) and
# skips the rest of the job - no pod is ever created on a day Kronos
# wouldn't trade on anyway. Manual (workflow_dispatch) runs always run,
# even on a non-trading day, since a human explicitly asked for one.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 6 * * 1-5"   # 06:00 UTC, Mon-Fri - comfortably before US market open
  workflow_dispatch:
    inputs:
      mode:
        description: "train.py --mode"
        required: false
        default: "full"
        type: choice
        options: [pretrain, finetune, meta, evolve, full]
      gpu_type:
        description: "RunPod GPU type ID (exact API name, e.g. from the console's GPU list)"
        required: false
        default: "NVIDIA RTX A5000"
        type: string
      cloud_type:
        description: "COMMUNITY (cheaper) or SECURE"
        required: false
        default: "COMMUNITY"
        type: choice
        options: [COMMUNITY, SECURE]

env:
  RUNPOD_API: https://rest.runpod.io/v1

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve run parameters
        id: params
        run: |
          set -euo pipefail
          pip install -q pyyaml
          echo "mode=${{ github.event.inputs.mode || 'full' }}" >> "$GITHUB_OUTPUT"
          echo "gpu_type=${{ github.event.inputs.gpu_type || 'NVIDIA RTX A5000' }}" >> "$GITHUB_OUTPUT"
          echo "cloud_type=${{ github.event.inputs.cloud_type || 'COMMUNITY' }}" >> "$GITHUB_OUTPUT"
          N_ASSETS=$(python3 -c "
          import yaml
          cfg = yaml.safe_load(open('kronos/config.yaml'))
          print(len(cfg['data']['tickers']))
          ")
          echo "n_assets=$N_ASSETS" >> "$GITHUB_OUTPUT"

      - name: Skip on non-trading days (scheduled runs only)
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Loaded as a standalone file, not `import kronos` - calendar_utils.py
          # is the one module in this package with zero third-party
          # dependencies, and it should stay that way: importing the `kronos`
          # package normally would run kronos/__init__.py first, which pulls
          # in torch/numpy/pandas/etc. just to check a weekday.
          SHOULD_RUN=$(python3 -c "
          import importlib.util
          from datetime import datetime
          from zoneinfo import ZoneInfo
          spec = importlib.util.spec_from_file_location('calendar_utils', 'kronos/calendar_utils.py')
          calendar_utils = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(calendar_utils)
          today = datetime.now(ZoneInfo('America/New_York')).date()
          print('true' if calendar_utils.is_trading_day(today) else 'false')
          ")
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Not a trading day (weekend or NYSE holiday) - skipping, no pod will be created."
          fi

      - name: Load RunPod SSH key
        if: steps.gate.outputs.should_run == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.RUNPOD_SSH_PRIVATE_KEY }}

      - name: Create pod
        id: create
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          create_pod() {
            local cloud_type="$1"
            curl -sS -X POST "$RUNPOD_API/pods" \
              -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "kronos-ci-${{ github.run_id }}",
                "imageName": "runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04",
                "gpuTypeIds": ["${{ steps.params.outputs.gpu_type }}"],
                "gpuCount": 1,
                "cloudType": "'"$cloud_type"'",
                "containerDiskInGb": 20,
                "ports": ["22/tcp"]
              }'
          }

          PRIMARY_CLOUD="${{ steps.params.outputs.cloud_type }}"
          RESPONSE=$(create_pod "$PRIMARY_CLOUD")
          echo "$RESPONSE"
          POD_ID=$(echo "$RESPONSE" | jq -r '.id')

          # Community Cloud is peer-hosted - capacity fluctuates and "no
          # instances currently available" is a routine, expected failure
          # mode there, not a bug. An unattended nightly run has no human
          # around to notice and retry manually (as we did once by hand),
          # so fall back to Secure Cloud (dedicated capacity, reliably
          # available, higher per-hour rate) automatically instead of
          # just failing the night's training silently.
          if { [ -z "$POD_ID" ] || [ "$POD_ID" = "null" ]; } && [ "$PRIMARY_CLOUD" != "SECURE" ]; then
            echo "::warning::$PRIMARY_CLOUD had no capacity - falling back to SECURE cloud."
            RESPONSE=$(create_pod "SECURE")
            echo "$RESPONSE"
            POD_ID=$(echo "$RESPONSE" | jq -r '.id')
          fi

          if [ -z "$POD_ID" ] || [ "$POD_ID" = "null" ]; then
            echo "::error::Pod creation failed on both $PRIMARY_CLOUD and SECURE - no id in response above."
            exit 1
          fi
          echo "pod_id=$POD_ID" >> "$GITHUB_OUTPUT"
          echo "Created pod: $POD_ID"

      - name: Poll until the pod is running and reachable
        id: connect
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          POD_ID="${{ steps.create.outputs.pod_id }}"
          for i in $(seq 1 60); do
            RESPONSE=$(curl -sS "$RUNPOD_API/pods/$POD_ID" \
              -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}")
            STATUS=$(echo "$RESPONSE" | jq -r '.desiredStatus // empty')
            IP=$(echo "$RESPONSE" | jq -r '.publicIp // empty')
            PORT=$(echo "$RESPONSE" | jq -r '.portMappings["22"] // empty')
            echo "  [$i/60] status=$STATUS ip=${IP:-<pending>} port=${PORT:-<pending>}"
            if [ "$STATUS" = "RUNNING" ] && [ -n "$IP" ] && [ -n "$PORT" ]; then
              echo "host=$IP" >> "$GITHUB_OUTPUT"
              echo "port=$PORT" >> "$GITHUB_OUTPUT"
              echo "Pod reachable at $IP:$PORT"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Pod never reported RUNNING with a public IP within 10 minutes."
          exit 1

      - name: Wait for sshd inside the container
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 \
                   -p "${{ steps.connect.outputs.port }}" \
                   "root@${{ steps.connect.outputs.host }}" 'echo ready' 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::SSH never came up inside the container."
          exit 1

      - name: Train
        if: steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          ssh -p "${{ steps.connect.outputs.port }}" \
              "root@${{ steps.connect.outputs.host }}" '
            set -euo pipefail
            git clone --branch claude/prometheus-causal-market-ol2pau \
              "https://x-access-token:'"${{ secrets.GITHUB_TOKEN }}"'@github.com/saisantoshtangirala/prometheus" \
              /opt/prometheus
            cd /opt/prometheus
            pip install -q -e .
            pip install -q pyyaml yfinance
            python scripts/train.py --mode "'"${{ steps.params.outputs.mode }}"'" --device cuda --n-assets "'"${{ steps.params.outputs.n_assets }}"'"
            tar czf /tmp/checkpoints.tar.gz checkpoints
          '
          scp -P "${{ steps.connect.outputs.port }}" \
              "root@${{ steps.connect.outputs.host }}:/tmp/checkpoints.tar.gz" \
              ./checkpoints.tar.gz

      - name: Upload checkpoint artifact
        if: success() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kronos-checkpoints-${{ github.run_id }}
          path: checkpoints.tar.gz
          retention-days: 30

      - name: Deliver checkpoint to Hetzner
        if: success() && steps.gate.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          ssh-add - <<< "${{ secrets.HETZNER_SSH_KEY }}"
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts
          scp checkpoints.tar.gz \
              "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}:/tmp/runpod_checkpoint.tar.gz"
          ssh "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            set -euo pipefail
            mkdir -p /opt/prometheus/checkpoints/runpod
            tar xzf /tmp/runpod_checkpoint.tar.gz -C /opt/prometheus/checkpoints/runpod --strip-components=1
            rm -f /tmp/runpod_checkpoint.tar.gz
            echo "Delivered - Kronos will pick this up within its next 30-60s poll."
          '

      - name: Terminate pod (ALWAYS - zero idle billing by design)
        if: always() && steps.create.outputs.pod_id != ''
        run: |
          curl -sS -X DELETE "$RUNPOD_API/pods/${{ steps.create.outputs.pod_id }}" \
            -H "Authorization: Bearer ${{ secrets.RUNPOD_API_KEY }}" \
            -o /dev/null -w "Terminate response: %{http_code}\n" || \
            echo "::error::Failed to terminate pod ${{ steps.create.outputs.pod_id }} - check the RunPod console NOW."
