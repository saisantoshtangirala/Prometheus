name: Check RunPod GPU Catalog (read-only)

# Ad-hoc diagnostic: the "Pick GPU" step in train-runpod.yml hit
# HTTP 403 Forbidden querying api.runpod.io/v2/catalog/gpus with the
# same RUNPOD_API_KEY that successfully creates pods against the v1
# REST API (rest.runpod.io/v1/pods) - 403 (not 401) means the key
# authenticated fine but isn't authorized for this specific endpoint.
# This prints the real response body from both APIs side by side to
# find out why, without spinning up a pod just to see one log line.
# Manual trigger only.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query both RunPod APIs and print full responses
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -uo pipefail
          # GitHub Actions auto-masks the literal secret value anywhere it
          # appears in step output, so no manual redaction needed here.

          echo "=== v2 catalog (the one that 403'd): GET api.runpod.io/v2/catalog/gpus ==="
          curl -sS -i \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://api.runpod.io/v2/catalog/gpus?include=AVAILABILITY" \
            | head -c 4000
          echo
          echo

          echo "=== v1 REST (known-working, used by Create Pod): GET rest.runpod.io/v1/pods ==="
          curl -sS -i \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://rest.runpod.io/v1/pods" \
            | head -c 2000
          echo

          echo
          echo "=== v1 REST gpuTypes listing, if it exists (comparison) ==="
          curl -sS -i \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://rest.runpod.io/v1/gputypes" \
            | head -c 2000
