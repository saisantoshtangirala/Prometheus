name: Check Hetzner Status (read-only)

# Ad-hoc diagnostic: SSHs into the Hetzner box and reports whether the
# latest RunPod-trained checkpoint (checkpoints/runpod/meta/snn.pt) was
# actually adopted by the live kronos.service process, without touching
# the service in any way - no restart, no code pull, purely read-only.
# Manual trigger only.

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Load Hetzner deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Trust Hetzner host key
        run: ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Report checkpoint and adoption status
        run: |
          ssh "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" '
            set -uo pipefail
            echo "=== kronos.service ==="
            systemctl is-active kronos.service
            systemctl show kronos.service -p ActiveEnterTimestamp

            echo
            echo "=== RunPod checkpoint on disk ==="
            ls -la /opt/prometheus/checkpoints/runpod/meta/snn.pt 2>&1

            echo
            echo "=== Persisted active SNN (only written after a successful adoption) ==="
            ls -la /opt/prometheus/logs/models/reflex_snn_active.pt 2>&1

            echo
            echo "=== journalctl (unit lifecycle only - StandardOutput is redirected to a file, not journald) ==="
            journalctl -u kronos.service --no-pager -n 20

            echo
            echo "=== /var/log/kronos-service.log (systemd StandardOutput/StandardError target) - RunPod/adoption lines ==="
            tail -n 5000 /var/log/kronos-service.log 2>&1 | grep -i "runpod\|adopted" || echo "(no matching log lines in the last 5000)"

            echo
            echo "=== /opt/prometheus/logs/kronos.log (app FileHandler) - RunPod/adoption lines ==="
            tail -n 5000 /opt/prometheus/logs/kronos.log 2>&1 | grep -i "runpod\|adopted" || echo "(no matching log lines in the last 5000)"

            echo
            echo "=== last 15 lines of /var/log/kronos-service.log, unfiltered ==="
            tail -n 15 /var/log/kronos-service.log 2>&1

            echo
            echo "=== most recent Traceback/ERROR/CRITICAL in /var/log/kronos-service.log (with context) ==="
            grep -n -B2 -A30 "Traceback\|\[ERROR\]\|\[CRITICAL\]" /var/log/kronos-service.log 2>&1 | tail -n 200 || echo "(none found)"

            echo
            echo "=== disk usage (df -h) ==="
            df -h /

            echo
            echo "=== largest contributors under /opt/prometheus and /var/log ==="
            du -sh /opt/prometheus/logs/* /var/log/kronos-service.log 2>&1 | sort -rh

            echo
            echo "=== periodic jobs that could interfere with logs/trades.db (diagnosing the ~61-min-interval sqlite crash - disk is NOT full, 7% used) ==="
            echo "--- systemd timers ---"
            systemctl list-timers --all --no-pager 2>&1
            echo "--- root crontab ---"
            crontab -l 2>&1
            echo "--- /etc/cron.* ---"
            ls -la /etc/cron.d /etc/cron.hourly 2>&1
            echo "--- logrotate rules mentioning prometheus/kronos/trades ---"
            grep -rl "prometheus\|kronos\|trades" /etc/logrotate.d/ 2>&1 || echo "(none found)"

            echo
            echo "=== open file descriptor count for the running kronos process (crash interval tracks time-SINCE-RESTART, not wall clock - points at an in-process leak, e.g. yfinance not closing something per reflex tick, not a scheduled job) ==="
            KPID=$(systemctl show kronos.service -p MainPID --value)
            echo "MainPID=$KPID"
            if [ -n "$KPID" ] && [ "$KPID" != "0" ]; then
              echo "open fd count: $(ls /proc/$KPID/fd 2>/dev/null | wc -l)"
              echo "--- soft/hard open-file limit for this process ---"
              grep -i "open files" /proc/$KPID/limits 2>&1
              echo "--- fd targets sample (first 30) ---"
              ls -la /proc/$KPID/fd 2>&1 | head -30
            fi
          '
