[pytest]
testpaths = tests
addopts = -v --tb=short -q
markers =
    gpu: requires CUDA GPU
    slow: runtime > 30 seconds
    integration: integration or end-to-end test
    unit: pure unit test
    stress: adversarial stress test
    hypothesis: property-based test (Hypothesis library)
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::RuntimeWarning
