# =============================================================================
# Project Kronos - 365-Day Self-Evolving Paper Trading Organism
# All tunable hyperparameters for the daily lifecycle. No magic numbers in code.
# =============================================================================

run:
  total_days: 365
  timezone: "Asia/Kolkata"       # NSE - India Standard Time, no DST
  mode: "paper"                  # paper | replay (no live mode by design)
  log_dir: "logs"
  seed: 42

# Daily phase schedule (24h clock, exchange timezone). Pre-market phases
# (digestion..report) keep the same 00:00-06:00 offsets used for NYSE -
# NSE opens later in the day (09:15 IST vs 09:30 ET) so the same budget
# fits with even more margin.
schedule:
  digestion_start: "00:00"
  nightmare_start: "02:00"
  evolution_start: "04:00"
  adaptation_start: "05:00"
  report_time: "06:00"
  market_open: "09:15"           # NSE regular session
  market_close: "15:30"          # NSE regular session (excludes the
                                  # Aug-2026 15:15-15:35 closing auction)

data:
  tickers: ["RELIANCE.NS", "TCS.NS", "HDFCBANK.NS", "INFY.NS", "ICICIBANK.NS",
            "HINDUNILVR.NS", "ITC.NS", "SBIN.NS", "BHARTIARTL.NS", "KOTAKBANK.NS"]
  vix_ticker: "^INDIAVIX"
  lookback_days: 30              # rolling window kept in DailyMemory
  sources: ["yfinance"]          # Polygon/Alpha Vantage don't meaningfully cover NSE
  cross_validation_tolerance_pct: 1.0   # max % close-price disagreement between sources
  max_missing_pct: 20.0          # discard a ticker's day if more data is missing
  kalman_process_noise: 0.001
  kalman_obs_noise: 0.1

nightmare:
  n_futures: 10000
  batch_size: 500                # generate in batches to bound memory
  horizon_days: 5
  worst_case_bias: 0.7           # fraction of futures conditioned adversarially
  diffusion_steps: 50            # reduced from 1000 for nightly time budget
  seed: null                     # null = fresh nightmares nightly

evolution:
  population_size: 20
  n_generations: 3
  top_k: 5                       # variants combined into the master ensemble
  mutation_rate: 0.25
  crossover_rate: 0.5
  elitism: 2
  fallback_population_size: 6    # graceful degradation (local machine)
  fallback_generations: 1

adaptation:
  inner_lr: 0.01
  n_inner_steps: 3               # exactly 3 - the MAML contract
  support_days: 3                # adapt on last 3 trading days

reflex:
  inference_budget_ms: 1000
  vix_spike_sigma: 2.0           # kill-gate threshold in rolling std devs
  vix_window: 20                 # rolling window (bars) for mean/std
  lockout_minutes: 30
  imbalance_threshold: 0.65      # order-book imbalance alert level

trading:
  initial_capital: 100000.0
  max_position_pct: 0.25         # Kelly cap - never exceeded
  kelly_fraction: 0.5
  slippage:
    high_liquidity_pct: 0.05     # SPY-class
    mid_liquidity_pct: 0.15
    low_liquidity_pct: 0.50      # thin names
    high_liquidity_min_volume: 10000000
    mid_liquidity_min_volume: 1000000
  commission_per_trade: 0.0      # paper trading
  db_path: "logs/trades.db"

orchestrator:
  max_retries_per_phase: 1       # retry once, then log fatal and move on
  veto_file: "veto.txt"
  veto_delay_hours: 24           # human overrides take 24h to apply
  heartbeat_minutes: 60          # audit-trail snapshot cadence
  checkpoint_dir: "logs/models"
  report_dir: "logs/reports"

# Independent risk layer - enforced in code the ML pipeline cannot reach,
# so a bad signal or a bug in reflex/evolution can never itself defeat
# these limits. Distinct from orchestrator.veto_file: that's a 24h-delayed
# human override for deliberate strategic intervention; this is immediate,
# automatic, and exists precisely to act faster than a human could.
risk:
  enabled: true
  max_daily_loss_pct: 0.05       # loss from the day's opening equity -> auto-flatten + halt
  max_drawdown_pct: 0.20         # loss from the campaign's peak-ever equity -> auto-flatten + halt
  max_single_order_pct: 0.30     # reject any single order notional above this fraction of equity
  max_price_deviation_pct: 0.20  # reject a fill priced this far from the last known price (fat-finger/bad-data guard)
  halt_file: "logs/risk_halt.flag"    # created automatically on an automatic trip; its presence blocks new positions until an operator removes it
  kill_switch_file: "KILL_SWITCH"     # operator-created file (repo root) -> immediate flatten + halt, no delay, no ML involved

reporting:
  top_movers: 3
  volatility_windows: [5, 20]

# The GA-evolved strategy trained on RunPod by nightevolver/. Wired
# through kronos/nightevolver_bridge.py, which loads the checkpoint only
# if it clears the deflated-Sharpe gate in nightevolver/saver.py.
#
# DISABLED BY DEFAULT, and that is a finding rather than caution: this
# project's information audit could not establish a directional edge in
# this data by three independent methods, and the break-even win rate
# implied by NSE's ~22bp round-trip sits above what the measured
# correlations support. The wiring makes the checkpoint reachable and
# auditable; it does not make it profitable.
#
# blend_weight is the fraction of the signal handed to the GA strategy
# on the tickers it covers - 0.0 means "loaded, verified, reported, and
# trading nothing". Tickers outside the checkpoint's universe keep the
# SNN's signal untouched. Raise this deliberately, in paper mode, and
# only with out-of-sample evidence in hand.
nightevolver:
  enabled: false
  checkpoint_path: "checkpoints/nightevolver/nightevolver_best.json"
  blend_weight: 0.0              # 0.0 = observe only; 1.0 = fully replace
  history_days: 180              # must exceed WARMUP_BARS + 2 = 62
  max_position: 0.10
  require_gate: true             # never load a checkpoint below the DSR gate

# Not yet wired into KronosOrchestrator - see kronos/execution_adapter.py's
# module docstring for why (needs the operator's real IBKR paper-account
# credentials and weeks of proven stability before any live wiring).
execution:
  mode: "simulated"    # simulated | ibkr

notifications:
  enabled: false                 # opt-in - also needs KRONOS_TELEGRAM_BOT_TOKEN
                                  # and KRONOS_TELEGRAM_CHAT_ID env vars set
  send_daily_digest: true        # sent once per day, after market close
  large_pnl_alert_pct: 0.10      # a single day's |pnl| this fraction of day-start equity -> extra out-of-band alert, not just the daily digest

backup:
  dir: "logs/backups"            # trades.db copied here once per day, after close_day()
  max_backups: 30                # oldest copies beyond this count are deleted
